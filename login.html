<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUBEX - Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="navbar">
    <a href="index.html" class="navbar-logo">
      <span class="icono-nube">☁️</span> NUBEX
    </a>
    <div class="navbar-links"></div>
    <div></div>
  </div>

  <div class="formulario-contenedor">
    <div class="icono-circular"><span>☁️</span></div>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Entrá a tu cuenta para seguir administrando tus archivos.</p>

    <!-- comun.js / login.js escriben aca los mensajes de error o exito -->
    <div id="mensaje-login" class="mensaje"></div>

    <form id="form-login">
      <div class="campo-formulario">
        <label for="correo_electronico">Correo electrónico</label>
        <input type="email" id="correo_electronico" maxlength="30" required>
      </div>

      <div class="campo-formulario">
        <label for="password">Contraseña</label>
        <input type="password" id="password" maxlength="20" required>
      </div>

      <button type="submit" class="boton boton-primario">Ingresar</button>
    </form>

    <!-- Opcion alternativa: entrar con "llave de acceso" en vez de password.
         Arranca oculta: el boton de abajo alterna entre esta y el form de arriba,
         en vez de mostrar las dos formas de entrar apiladas todo el tiempo. -->
    <div id="bloque-llave-acceso" hidden>
      <div class="campo-formulario">
        <label for="llave_acceso">Llave de acceso</label>
        <input type="text" id="llave_acceso" maxlength="30" placeholder="Pegá o escribí tu llave">
      </div>
      <button type="button" id="boton-llave-acceso" class="boton boton-primario">
        Ingresar con llave
      </button>
    </div>

    <button type="button" id="boton-alternar-acceso" class="enlace-alternar">
      Usar llave de acceso en su lugar
    </button>

    <div class="enlace-secundario">
      ¿No tenés cuenta? <a href="registro.html">Registrate acá</a>
    </div>
  </div>

  <script src="comun.js"></script>
  <script src="login.js"></script>
</body>
</html>
